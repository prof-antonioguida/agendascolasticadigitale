<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Agenda Didattica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Work+Sans:wght@400;500;600;700&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3ECDC;
  --paper-deep:#EAE0C6;
  --paper-line:#D9CBA6;
  --ink:#2E2A22;
  --ink-soft:#6B6250;
  --leather:#5B3524;
  --leather-deep:#3B2116;
  --leather-light:#7A4A32;
  --gold:#C9A15E;
  --accent:#A23A2C;
  --accent-deep:#7E2C21;
  --shadow:rgba(46,32,20,.28);
  --radius:14px;
  --font-display:'Fraunces',serif;
  --font-body:'Work Sans',sans-serif;
  --font-hand:'Caveat',cursive;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  color:var(--ink);
  background:var(--leather-deep);
  min-height:100vh;
}
h1,h2,h3{font-family:var(--font-display);margin:0;}
button{font-family:inherit;}
input,select{font-family:inherit;}
::selection{background:var(--gold);color:var(--leather-deep);}

/* ---------- Screens ---------- */
.screen{display:none;min-height:100vh;}
.screen.active{display:block;}
.paper{
  background:
    repeating-linear-gradient(180deg, rgba(217,203,166,0) 0px, rgba(217,203,166,0) 27px, rgba(217,203,166,.55) 28px),
    radial-gradient(circle at 12% 8%, rgba(255,255,255,.35), transparent 45%),
    var(--paper);
}
.page-wrap{max-width:1080px;margin:0 auto;padding:22px 20px 60px;}

.page-rings{display:flex;justify-content:space-between;padding:0 30px;max-width:1080px;margin:0 auto;}
.page-rings span{
  width:13px;height:20px;border-radius:50%;margin-top:-2px;
  background:linear-gradient(180deg,#d8d8d8,#8d8d8d);
  box-shadow:inset 0 2px 2px rgba(0,0,0,.35), 0 1px 1px rgba(255,255,255,.35);
}

.top-header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
.top-header h1{font-size:1.5rem;font-weight:600;}
.header-back{display:flex;align-items:center;gap:10px;}

.icon-btn{
  width:42px;height:42px;border-radius:10px;border:1px solid var(--paper-line);
  background:#FFFDF8;display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--ink);flex-shrink:0;
}
.icon-btn:hover{background:#fff;}
.icon-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.icon-btn svg{width:20px;height:20px;}
.icon-btn:focus-visible, button:focus-visible, input:focus-visible, .agenda-card:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}

.topbar-btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:10px;
  border:1px solid var(--paper-line);background:#FFFDF8;cursor:pointer;
  font-size:.86rem;color:var(--ink);white-space:nowrap;
}
.topbar-btn svg{width:18px;height:18px;}
.topbar-btn.primary{background:var(--accent);border-color:var(--accent-deep);color:#fff;font-weight:600;}
.topbar-btn.primary.needs-save{box-shadow:0 0 0 3px rgba(162,58,44,.25);}

/* ---------- Auth screen ---------- */
#screen-auth{
  background:
    radial-gradient(circle at 20% 15%, rgba(255,255,255,.06), transparent 40%),
    linear-gradient(155deg, var(--leather-light), var(--leather) 55%, var(--leather-deep));
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
}
.auth-card{
  width:100%;max-width:420px;background:rgba(30,17,10,.35);
  border:1px solid rgba(201,161,94,.35);border-radius:18px;
  padding:38px 32px 30px;box-shadow:0 24px 60px rgba(0,0,0,.45);
  backdrop-filter:blur(2px);
}
.auth-brand{text-align:center;margin-bottom:22px;}
.auth-brand .book-icon{width:46px;height:46px;color:var(--gold);margin:0 auto 8px;}
.auth-brand h1{color:var(--gold);font-size:1.7rem;letter-spacing:.02em;}
.auth-brand p{color:#e8dcc4;font-family:var(--font-hand);font-size:1.15rem;margin-top:2px;}
.auth-tabs{display:flex;gap:6px;margin-bottom:20px;background:rgba(0,0,0,.25);border-radius:10px;padding:4px;}
.auth-tabs button{
  flex:1;padding:9px 0;border:none;border-radius:8px;background:transparent;color:#e8dcc4;
  cursor:pointer;font-weight:600;font-size:.88rem;
}
.auth-tabs button.active{background:var(--gold);color:var(--leather-deep);}
.auth-field{margin-bottom:14px;}
.auth-field label{display:block;color:#e8dcc4;font-size:.8rem;margin-bottom:5px;}
.auth-field input{
  width:100%;padding:11px 12px;border-radius:9px;border:1px solid rgba(201,161,94,.4);
  background:rgba(255,251,242,.94);color:var(--ink);font-size:.95rem;
}
.auth-error{color:#ffb4a8;font-size:.82rem;min-height:18px;margin:4px 0 6px;}
.auth-submit{
  width:100%;padding:12px 0;border-radius:10px;border:none;background:var(--accent);
  color:#fff;font-weight:700;font-size:.98rem;cursor:pointer;margin-top:6px;letter-spacing:.02em;
}
.auth-submit:hover{background:var(--accent-deep);}
.auth-submit:disabled{opacity:.6;cursor:default;}
.auth-footer{text-align:center;margin-top:20px;color:#c9bda1;font-size:.75rem;}
.auth-footer a{color:var(--gold);}

/* ---------- Home ---------- */
.home-header{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px;}
.home-header .user-chip{display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--ink-soft);}
.home-header .user-chip button{
  background:none;border:1px solid var(--paper-line);border-radius:8px;padding:6px 10px;
  cursor:pointer;color:var(--ink-soft);font-size:.78rem;
}
.agenda-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:20px;
}
.agenda-card{
  cursor:pointer;background:transparent;border:none;padding:0;text-align:left;position:relative;
}
.agenda-delete{
  position:absolute;top:8px;left:8px;z-index:3;width:30px;height:30px;border-radius:50%;
  border:none;background:rgba(30,17,10,.55);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.agenda-delete svg{width:15px;height:15px;}
.agenda-delete:hover{background:var(--accent);}
.agenda-name{margin-top:9px;font-family:var(--font-display);font-weight:600;font-size:1.02rem;}
.empty-hint{color:var(--ink-soft);font-size:.95rem;padding:30px 0;}

.fab{
  position:fixed;right:26px;bottom:26px;width:60px;height:60px;border-radius:50%;
  background:var(--accent);color:#fff;border:none;box-shadow:0 10px 24px rgba(0,0,0,.35);
  display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:20;
}
.fab:hover{background:var(--accent-deep);}
.fab svg{width:26px;height:26px;}

/* ---------- Cover visual (reused: editor + thumbnail) ---------- */
.cover-visual{
  position:relative;width:100%;aspect-ratio:3/4;border-radius:12px;overflow:hidden;
  background:linear-gradient(160deg,var(--leather-light),var(--leather) 55%,var(--leather-deep));
  box-shadow:0 10px 22px var(--shadow), inset 0 0 0 2px rgba(201,161,94,.35);
  color:#F3ECDC;display:flex;flex-direction:column;justify-content:flex-end;
}
.cover-bg-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55;}
.cover-overlay{position:absolute;inset:0;background:linear-gradient(180deg, rgba(59,33,22,.1) 0%, rgba(59,33,22,.8) 100%);}
.cover-round-img{
  position:absolute;top:14px;right:14px;width:64px;height:64px;border-radius:50%;object-fit:cover;
  border:3px solid var(--gold);box-shadow:0 4px 10px rgba(0,0,0,.4);z-index:2;
}
.cover-round-placeholder{background:rgba(255,255,255,.12);border:2px dashed rgba(255,255,255,.45);}
.cover-text{position:relative;z-index:2;padding:16px 18px 20px;}
.cover-subject{font-family:var(--font-hand);font-size:1.35rem;color:var(--gold);line-height:1;}
.cover-name{font-family:var(--font-display);font-size:1.35rem;font-weight:600;margin:4px 0 12px;line-height:1.15;}
.cover-school{font-size:.82rem;opacity:.88;}
.cover-year{font-size:.82rem;opacity:.88;margin-top:2px;letter-spacing:.02em;}
.cover-visual.mini .cover-subject{font-size:1rem;}
.cover-visual.mini .cover-name{font-size:.95rem;margin:2px 0 6px;}
.cover-visual.mini .cover-school,.cover-visual.mini .cover-year{font-size:.66rem;}
.cover-visual.mini .cover-round-img{width:32px;height:32px;top:8px;right:8px;border-width:2px;}
.cover-visual.mini .cover-text{padding:8px 10px 10px;}

/* ---------- Menu screen ---------- */
.menu-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-top:26px;}
.menu-tile{
  background:#FFFDF8;border:1px solid var(--paper-line);border-radius:var(--radius);
  padding:28px 22px;text-align:left;cursor:pointer;box-shadow:0 6px 16px rgba(46,32,20,.1);
}
.menu-tile:hover{box-shadow:0 10px 22px rgba(46,32,20,.16);}
.menu-tile .tile-icon{width:34px;height:34px;color:var(--accent);margin-bottom:14px;}
.menu-tile h3{font-size:1.15rem;margin-bottom:4px;}
.menu-tile p{margin:0;color:var(--ink-soft);font-size:.85rem;}

/* ---------- Cover editor ---------- */
.cover-editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-top:20px;align-items:start;}
@media(max-width:820px){.cover-editor-grid{grid-template-columns:1fr;}}
.form-field{margin-bottom:16px;}
.form-field label{display:block;font-size:.82rem;color:var(--ink-soft);margin-bottom:6px;}
.form-field input[type=text]{
  width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--paper-line);
  background:#FFFDF8;font-size:.95rem;color:var(--ink);
}
.img-upload-row{display:flex;gap:12px;align-items:center;margin-top:6px;}
.img-upload-btn{
  padding:9px 14px;border-radius:8px;border:1px solid var(--paper-line);background:#FFFDF8;
  cursor:pointer;font-size:.82rem;color:var(--ink);
}
.img-upload-btn:hover{background:#fff;}
.img-clear-link{background:none;border:none;color:var(--accent-deep);font-size:.78rem;cursor:pointer;text-decoration:underline;}
.cover-preview-sticky{position:sticky;top:20px;}
.cover-preview-sticky .cover-visual{max-width:340px;margin:0 auto;}

/* ---------- Calendar screen ---------- */
.cal-year-row{display:flex;gap:10px;align-items:center;margin:18px 0 26px;flex-wrap:wrap;}
.cal-year-row input{
  padding:10px 12px;border-radius:8px;border:1px solid var(--paper-line);background:#FFFDF8;
  font-size:.95rem;width:160px;
}
.cal-year-row button{
  padding:10px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);
  color:#fff;font-weight:600;cursor:pointer;font-size:.88rem;
}
.cal-empty{color:var(--ink-soft);font-style:italic;}
#calGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px;}
.cal-month{background:#FFFDF8;border:1px solid var(--paper-line);border-radius:10px;padding:14px;}
.cal-month-title{font-family:var(--font-display);font-weight:600;text-transform:capitalize;margin-bottom:8px;font-size:.98rem;}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:.68rem;color:var(--ink-soft);margin-bottom:4px;}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-cell{
  aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:.78rem;
  border-radius:6px;cursor:pointer;color:var(--ink);
}
.cal-cell:hover{background:var(--paper-deep);}
.cal-cell.empty{cursor:default;}
.cal-cell.empty:hover{background:none;}
.cal-cell.today{background:var(--accent);color:#fff;font-weight:700;}

/* ---------- Day screen ---------- */
.day-topbar{
  position:sticky;top:0;z-index:15;background:var(--paper);border-bottom:1px solid var(--paper-line);
  display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 20px;flex-wrap:wrap;
}
.day-topbar .nav-group{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.day-agenda-tag{font-size:.78rem;color:var(--ink-soft);}
.date-bar{
  display:flex;align-items:center;justify-content:center;gap:18px;padding:20px 16px 8px;max-width:1080px;margin:0 auto;
}
.date-bar .date-label{font-family:var(--font-hand);font-size:1.8rem;text-align:center;min-width:280px;}
.day-toolbar{
  display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px;background:var(--paper-deep);
  border-radius:12px;margin:10px auto 22px;max-width:1080px;justify-content:center;
}
#dayElements{max-width:820px;margin:0 auto;}

.el-block{
  position:relative;background:#FFFDF8;border:1px solid var(--paper-line);border-radius:10px;
  padding:10px 12px;margin-bottom:14px;box-shadow:0 2px 6px rgba(46,32,20,.08);
}
.el-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.el-type-icon svg{width:15px;height:15px;color:var(--ink-soft);opacity:.55;}
.el-x{background:none;border:none;cursor:pointer;color:var(--ink-soft);width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.el-x:hover{background:rgba(162,58,44,.12);color:var(--accent);}
.el-x svg{width:13px;height:13px;}

.text-toolbar,.draw-toolbar{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}
.text-toolbar select{padding:5px 6px;border-radius:6px;border:1px solid var(--paper-line);background:#fff;font-size:.78rem;}
.text-toolbar button{width:30px;height:30px;border-radius:6px;border:1px solid var(--paper-line);background:#fff;cursor:pointer;font-weight:700;font-size:.82rem;}
.text-toolbar button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.text-toolbar input[type=color]{width:32px;height:30px;padding:0;border-radius:6px;border:1px solid var(--paper-line);background:#fff;cursor:pointer;}
.text-content{min-height:44px;outline:none;line-height:1.5;padding:5px 3px;}
.text-content:empty:before{content:'Scrivi qui...';color:#B4A98C;}

.draw-toolbar input[type=color]{width:32px;height:30px;padding:0;border-radius:6px;border:1px solid var(--paper-line);background:#fff;cursor:pointer;}
.draw-toolbar input[type=range]{width:110px;}
.draw-thick-label{font-size:.75rem;color:var(--ink-soft);min-width:32px;}
.draw-canvas{width:100%;height:260px;display:block;background:#FFFEFB;border:1px dashed var(--paper-line);border-radius:6px;touch-action:none;cursor:crosshair;}

.el-image img{max-width:100%;border-radius:6px;display:block;}
.el-audio-block audio,.el-video-block video{width:100%;display:block;}
.el-video-block video{border-radius:6px;max-height:400px;}
.el-link{display:inline-flex;align-items:center;gap:7px;color:var(--accent-deep);text-decoration:none;font-weight:600;font-size:.92rem;}
.el-link svg{width:16px;height:16px;}
.empty-day-hint{text-align:center;color:var(--ink-soft);font-style:italic;padding:30px 0;}

.recording-banner{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;
  padding:10px 18px;border-radius:30px;display:flex;align-items:center;gap:14px;z-index:60;box-shadow:0 8px 20px rgba(0,0,0,.3);
  font-size:.85rem;
}
.recording-banner button{background:#fff;color:var(--accent);border:none;border-radius:16px;padding:6px 14px;font-weight:700;cursor:pointer;font-size:.8rem;}

/* ---------- Modal ---------- */
#modalOverlay{
  position:fixed;inset:0;background:rgba(20,12,7,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;
}
#modalOverlay.active{display:flex;}
#modalBox{
  background:var(--paper);border-radius:14px;padding:26px 24px;max-width:400px;width:100%;
  box-shadow:0 24px 60px rgba(0,0,0,.4);
}
#modalBox h3{margin-bottom:16px;font-size:1.15rem;}
#modalBox label{display:block;font-size:.8rem;color:var(--ink-soft);margin:10px 0 5px;}
#modalBox input[type=text],#modalBox input[type=url],#modalBox input[type=time]{
  width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--paper-line);background:#FFFDF8;font-size:.92rem;
}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}
.btn-primary,.btn-secondary{padding:9px 16px;border-radius:8px;font-size:.86rem;cursor:pointer;font-weight:600;}
.btn-primary{background:var(--accent);border:1px solid var(--accent-deep);color:#fff;}
.btn-primary:hover{background:var(--accent-deep);}
.btn-secondary{background:#fff;border:1px solid var(--paper-line);color:var(--ink);}
.modal-choices{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
.choice-btn{
  display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:9px;border:1px solid var(--paper-line);
  background:#FFFDF8;cursor:pointer;font-size:.9rem;color:var(--ink);text-align:left;
}
.choice-btn:hover{background:#fff;}
.choice-btn svg{width:20px;height:20px;color:var(--accent);flex-shrink:0;}

/* ---------- Toast ---------- */
#toastContainer{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:24px;font-size:.85rem;
  opacity:0;transform:translateY(-8px);transition:opacity .25s, transform .25s;box-shadow:0 8px 20px rgba(0,0,0,.3);
}
.toast.show{opacity:1;transform:translateY(0);}
.toast-error{background:var(--accent-deep);}
.toast-success{background:#3f6b46;}

@media(max-width:600px){
  .date-bar .date-label{font-size:1.35rem;min-width:0;}
  .cover-preview-sticky .cover-visual{max-width:220px;}
}
</style>
</head>
<body>

<div id="toastContainer"></div>

<!-- ============ AUTH ============ -->
<div id="screen-auth" class="screen active">
  <div class="auth-card">
    <div class="auth-brand">
      <svg class="book-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"></rect><line x1="4" y1="7" x2="20" y2="7"></line></svg>
      <h1>Agenda Didattica</h1>
      <p>la tua agenda, sempre con te</p>
    </div>
    <div class="auth-tabs">
      <button type="button" id="authTabLogin" class="active">Accedi</button>
      <button type="button" id="authTabRegister">Registrati</button>
    </div>
    <form id="authForm" autocomplete="on">
      <div class="auth-field">
        <label for="authEmail">Email</label>
        <input type="email" id="authEmail" autocomplete="username" required>
      </div>
      <div class="auth-field">
        <label for="authPassword">Password</label>
        <input type="password" id="authPassword" autocomplete="current-password" required>
      </div>
      <div class="auth-field" id="authConfirmWrap" style="display:none;">
        <label for="authConfirm">Conferma password</label>
        <input type="password" id="authConfirm" autocomplete="new-password">
      </div>
      <div class="auth-error" id="authError"></div>
      <button type="submit" class="auth-submit" id="authSubmitBtn">Accedi</button>
    </form>
    <div class="auth-footer">Agenda Didattica &middot; del prof. Antonio Guida<br><a href="mailto:furtwangler900@gmail.com">furtwangler900@gmail.com</a></div>
  </div>
</div>

<!-- ============ HOME ============ -->
<div id="screen-home" class="screen paper">
  <div class="page-rings">__RINGS__</div>
  <div class="page-wrap">
    <div class="home-header">
      <h1>Le mie agende</h1>
      <div class="user-chip">
        <span id="userEmailLabel"></span>
        <button type="button" id="btnLogout">Esci</button>
      </div>
    </div>
    <div class="agenda-grid" id="agendaGrid"></div>
  </div>
  <button type="button" class="fab" id="btnNewAgenda" title="Nuova agenda">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
  </button>
</div>

<!-- ============ MENU (buttons page) ============ -->
<div id="screen-menu" class="screen paper">
  <div class="page-rings">__RINGS__</div>
  <div class="page-wrap">
    <div class="top-header">
      <div class="header-back">
        <button type="button" class="icon-btn" id="menuBackHome" data-icon="home" title="Home"></button>
        <h1 id="menuAgendaName"></h1>
      </div>
    </div>
    <div class="menu-tiles">
      <button type="button" class="menu-tile" id="menuBtnCover">
        <svg class="tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"></rect><line x1="4" y1="7" x2="20" y2="7"></line></svg>
        <h3>Modifica copertina</h3>
        <p>Personalizza nome, materia, scuola e foto</p>

function $(sel){ return document.querySelector(sel); }

function escapeAttr(s){ return (s||'').replace(/"/g,'&quot;'); }

async function sha256(text){
  var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
}

}

/* ================= Storage helpers ================= */
async function stGet(key){
  try{ var r = await window.storage.get(key, true); return (r && r.value!=null) ? r.value : null; }
  catch(e){ return null; }
}
async function stSet(key, value){
  try{ var r = await window.storage.set(key, value, true); return !!r; }
  catch(e){ console.error('storage set error', e); return false; }
}
async function stDelete(key){
  try{ await window.storage.delete(key, true); return true; }
  catch(e){ return false; }
}
async function stList(prefix){
  try{ var r = await window.storage.list(prefix, true); return (r && r.keys) ? r.keys : []; }
  catch(e){ return []; }
}
async function getJSON(key){
  var v = await stGet(key);
  if(v==null) return null;
  try{ return JSON.parse(v); }catch(e){ return null; }
}
async function setJSON(key, obj){
  return stSet(key, JSON.stringify(obj));
}

/* ================= State ================= */
var state = {

var MONTH_NAMES = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
var DAY_NAMES = ['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
var DAY_LETTERS = ['L','M','M','G','V','S','D'];

function dateKey(d){
  var y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}
function formatDateIt(d){
  var dn = DAY_NAMES[d.getDay()];
  var dd = String(d.getDate()).padStart(2,'0');
  var mn = MONTH_NAMES[d.getMonth()];
  return dn+' '+dd+' '+mn+' '+d.getFullYear();
}

/* ================= Image resize helper ================= */
function resizeImageFile(file, maxDim, quality){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var w=img.width, h=img.height;
        if(w>h){ if(w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; } }
        else { if(h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; } }
        var canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
        var ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ================= AUTH ================= */
function switchAuthMode(mode){
  state.authMode = mode;
  $('#authTabLogin').classList.toggle('active', mode==='login');
  $('#authTabRegister').classList.toggle('active', mode==='register');
  $('#authConfirmWrap').style.display = mode==='register' ? 'block' : 'none';
  $('#authSubmitBtn').textContent = mode==='login' ? 'Accedi' : 'Crea account';
  $('#authError').textContent='';
}
$('#authTabLogin').addEventListener('click', function(){ switchAuthMode('login'); });
$('#authTabRegister').addEventListener('click', function(){ switchAuthMode('register'); });

$('#authForm').addEventListener('submit', async function(e){
  e.preventDefault();
  var email = norm($('#authEmail').value);
  var pass = $('#authPassword').value;
  var errEl = $('#authError');
  errEl.textContent='';
  if(!email || !/^\S+@\S+\.\S+$/.test(email)){ errEl.textContent='Inserisci un indirizzo email valido.'; return; }
  if(pass.length<4){ errEl.textContent='La password deve contenere almeno 4 caratteri.'; return; }
  $('#authSubmitBtn').disabled=true;
  try{
    if(state.authMode==='register'){
      var confirmPass = $('#authConfirm').value;
      if(pass!==confirmPass){ errEl.textContent='Le due password non coincidono.'; $('#authSubmitBtn').disabled=false; return; }
      var existing = await getJSON('agenda_users:'+email);
      if(existing){ errEl.textContent="Questa email è già registrata. Effettua l'accesso."; $('#authSubmitBtn').disabled=false; return; }
      var hash = await sha256(pass);
      var ok = await setJSON('agenda_users:'+email, {email:email, passHash:hash, createdAt:Date.now()});
      if(!ok){ errEl.textContent='Errore durante la registrazione. Riprova.'; $('#authSubmitBtn').disabled=false; return; }
      await completeLogin(email);
    } else {
      var user = await getJSON('agenda_users:'+email);
      if(!user){ errEl.textContent="Email non trovata. Registrati prima di accedere."; $('#authSubmitBtn').disabled=false; return; }
      var hash2 = await sha256(pass);
      if(hash2!==user.passHash){ errEl.textContent='Password errata.'; $('#authSubmitBtn').disabled=false; return; }
      await completeLogin(email);
    }
  }catch(err){
    console.error(err);
    errEl.textContent='Si è verificato un errore. Riprova.';
  }
  $('#authSubmitBtn').disabled=false;
});

async function completeLogin(email){
  state.email = email;
  var list = await getJSON('agenda_list:'+email) || [];
  state.agende = list;
  state.allAlarms = [];
  for(var i=0;i<list.length;i++){
    var a = list[i];
    var idx = await getJSON('agenda_alarms:'+email+':'+a.id) || [];
    idx.forEach(function(al){ state.allAlarms.push({agendaId:a.id, date:al.date, time:al.time, fired:!!al.fired}); });
  }
  $('#userEmailLabel').textContent = email;
  renderHomeList();
  showScreen('screen-home');
}

$('#btnLogout').addEventListener('click', function(){
  if(state.dirty && !confirm('Hai modifiche non salvate. Uscire comunque?')) return;
  state.email=null; state.agende=[]; state.currentAgendaId=null; state.currentAgenda=null; state.allAlarms=[];
  $('#authEmail').value=''; $('#authPassword').value=''; $('#authConfirm').value='';
  switchAuthMode('login');
  showScreen('screen-auth');
});

/* ================= HOME ================= */
function renderHomeList(){
  var wrap = $('#agendaGrid');
  if(state.agende.length===0){
    wrap.innerHTML = '<p class="empty-hint">Non hai ancora creato nessuna agenda. Usa il pulsante "+" per iniziare.</p>';
    return;
  }
  wrap.innerHTML = state.agende.map(function(a){
    return '<div class="agenda-card" data-id="'+a.id+'" tabindex="0">'+
      '<button type="button" class="agenda-delete" data-id="'+a.id+'" title="Elimina agenda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+ICONS.trash+'</svg></button>'+
      renderCoverHTML(a.cover, true)+
      '<div class="agenda-name">'+escapeHtml(a.nome)+'</div>'+
    '</div>';
  }).join('');
  $$('.agenda-card').forEach(function(card){
    card.addEventListener('click', async function(e){
      if(e.target.closest('.agenda-delete')) return;
      await openAgendaById(card.dataset.id);
      showMenuScreen();
    });
  });
  $$('.agenda-delete').forEach(function(btn){
    btn.addEventListener('click', async function(e){
      e.stopPropagation();
      var id = btn.dataset.id;
      var a = state.agende.find(function(x){ return x.id===id; });
      if(!confirm('Eliminare definitivamente l\'agenda "'+(a?a.nome:'')+'"? Questa azione non può essere annullata.')) return;
      state.agende = state.agende.filter(function(x){ return x.id!==id; });
      await setJSON('agenda_list:'+state.email, state.agende);
      await stDelete('agenda_data:'+state.email+':'+id);
      var dayKeys = await stList('agenda_day:'+state.email+':'+id+':');
      for(var i=0;i<dayKeys.length;i++) await stDelete(dayKeys[i]);
      await stDelete('agenda_alarms:'+state.email+':'+id);
      state.allAlarms = state.allAlarms.filter(function(al){ return al.agendaId!==id; });
      renderHomeList();
      showToast('Agenda eliminata.', 'info');
    });
  });
}

  var startYear = parseInt(m[1],10);

function generateCalendar(label){
  var m = label.match(/(\d{4})/);
  var startYear = parseInt(m[1],10);
  var endYear = startYear+1;
  var months = [];
  var mi;
  for(mi=8; mi<=11; mi++) months.push({y:startYear, m:mi});
  for(mi=0; mi<=6; mi++) months.push({y:endYear, m:mi});
  var todayStr = dateKey(new Date());
  var html='';
  months.forEach(function(mo){
    var y=mo.y, m2=mo.m;
    var isJuly = (m2===6 && y===endYear);
    var firstDay = new Date(y,m2,1);
    var startOffset = firstDay.getDay();
    startOffset = (startOffset+6)%7;
    var daysInMonth = isJuly ? 30 : new Date(y, m2+1, 0).getDate();
    var cells='';
    var i,d;
    for(i=0;i<startOffset;i++) cells += '<div class="cal-cell empty"></div>';
    for(d=1; d<=daysInMonth; d++){
      var dObj = new Date(y,m2,d);
      var key = dateKey(dObj);
      var isToday = key===todayStr;
      cells += '<div class="cal-cell'+(isToday?' today':'')+'" data-date="'+key+'">'+d+'</div>';
    }
    html += '<div class="cal-month">'+
      '<div class="cal-month-title">'+MONTH_NAMES[m2]+' '+y+'</div>'+
      '<div class="cal-weekdays">'+DAY_LETTERS.map(function(l){ return '<span>'+l+'</span>'; }).join('')+'</div>'+
      '<div class="cal-days">'+cells+'</div>'+
    '</div>';
  });
  $('#calGrid').innerHTML = html;
  $$('#calGrid .cal-cell:not(.empty)').forEach(function(cell){
    cell.addEventListener('click', function(){
      var parts = cell.dataset.date.split('-').map(Number);
      openDayScreen(new Date(parts[0], parts[1]-1, parts[2]));
    });
  });
}

async function saveDayData(silent){
  var key = dayKeyStorage();
  var payload = {elements: state.dayElements, alarm: state.dayAlarm};
  var json = JSON.stringify(payload);
  if(json.length > 4.8*1024*1024){
    showToast('La pagina supera lo spazio massimo consentito. Rimuovi qualche file multimediale.', 'error');

    state.dirty=false;

    if(!silent) showToast('Agenda salvata.', 'success');

}

function elementTypeIcon(type){

function removeElementData(id){

function makeBlockShell(data, innerHTML, extraClass){
  var div = document.createElement('div');
  div.className = 'el-block '+(extraClass||'');
  div.dataset.id = data.id;
  div.innerHTML =
    '<div class="el-head">'+
      '<span class="el-type-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+elementTypeIcon(data.type)+'</svg></span>'+
      '<button type="button" class="el-x" title="Rimuovi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">'+ICONS.close+'</svg></button>'+
    '</div>'+
    '<div class="el-body">'+innerHTML+'</div>';
  div.querySelector('.el-x').addEventListener('click', function(){
    if(confirm('Rimuovere questo elemento?')){
      removeElementData(data.id);
      div.remove();
      if(state.dayElements.length===0){
        $('#dayElements').innerHTML = '<p class="empty-day-hint">Pagina vuota. Usa gli strumenti qui sopra per iniziare a scrivere.</p>';
      }
      markDirty();
    }
  });
  return div;
}

function renderTextBlock(data){
  var sizes = [14,16,18,20,24,28,32];
  var opts = sizes.map(function(s){ return '<option value="'+s+'"'+(s===data.size?' selected':'')+'>'+s+'px</option>'; }).join('');
  var inner =
    '<div class="text-toolbar">'+
      '<select class="t-size">'+opts+'</select>'+
      '<button type="button" class="t-bold'+(data.bold?' active':'')+'">G</button>'+
      '<button type="button" class="t-italic'+(data.italic?' active':'')+'" style="font-style:italic">C</button>'+
      '<button type="button" class="t-underline'+(data.underline?' active':'')+'" style="text-decoration:underline">S</button>'+
      '<input type="color" class="t-color" value="'+data.color+'">'+
    '</div>'+
    '<div class="text-content" contenteditable="true" style="font-size:'+data.size+'px; font-weight:'+(data.bold?'700':'400')+'; font-style:'+(data.italic?'italic':'normal')+'; text-decoration:'+(data.underline?'underline':'none')+'; color:'+data.color+';">'+(data.html||'')+'</div>';
  var shell = makeBlockShell(data, inner, 'el-text');
  var contentEl = shell.querySelector('.text-content');
  contentEl.addEventListener('input', function(){ data.html = contentEl.innerHTML; markDirty(); });
  shell.querySelector('.t-size').addEventListener('change', function(e){ data.size=+e.target.value; contentEl.style.fontSize=data.size+'px'; markDirty(); });
  var boldBtn=shell.querySelector('.t-bold'), italBtn=shell.querySelector('.t-italic'), undBtn=shell.querySelector('.t-underline');
  boldBtn.addEventListener('click', function(){ data.bold=!data.bold; boldBtn.classList.toggle('active',data.bold); contentEl.style.fontWeight=data.bold?'700':'400'; markDirty(); });
  italBtn.addEventListener('click', function(){ data.italic=!data.italic; italBtn.classList.toggle('active',data.italic); contentEl.style.fontStyle=data.italic?'italic':'normal'; markDirty(); });
  undBtn.addEventListener('click', function(){ data.underline=!data.underline; undBtn.classList.toggle('active',data.underline); contentEl.style.textDecoration=data.underline?'underline':'none'; markDirty(); });
  shell.querySelector('.t-color').addEventListener('input', function(e){ data.color=e.target.value; contentEl.style.color=data.color; markDirty(); });
  return shell;
}

function renderDrawingBlock(data){
  var inner =
    '<div class="draw-toolbar">'+
      '<input type="color" class="d-color" value="'+data.color+'" title="Colore tratto">'+
      '<input type="range" class="d-thick" min="1" max="24" value="'+data.thickness+'" title="Spessore tratto">'+
      '<span class="draw-thick-label">'+data.thickness+'px</span>'+
    '</div>'+
    '<div class="draw-canvas-wrap"><canvas class="draw-canvas"></canvas></div>';
  var shell = makeBlockShell(data, inner, 'el-drawing');
  var canvas = shell.querySelector('.draw-canvas');
  canvas.width = 800; canvas.height = 260;
  var ctx = canvas.getContext('2d');
  if(data.dataURL){
    var img = new Image();
    img.onload = function(){ ctx.drawImage(img,0,0,800,260); };
    img.src = data.dataURL;
  }
  var drawing=false, lastX=0, lastY=0;
  function pos(evt){
    var r = canvas.getBoundingClientRect();
    var clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
    var clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
    return [ (clientX-r.left)*canvas.width/r.width, (clientY-r.top)*canvas.height/r.height ];
  }
  function start(evt){ evt.preventDefault(); drawing=true; var p=pos(evt); lastX=p[0]; lastY=p[1]; }
  function move(evt){
    if(!drawing) return;
    evt.preventDefault();
    var p = pos(evt);
    ctx.lineJoin='round'; ctx.lineCap='round';
    if(state.eraserActive){ ctx.globalCompositeOperation='destination-out'; ctx.lineWidth = Math.max(10, data.thickness*3); }
    else { ctx.globalCompositeOperation='source-over'; ctx.strokeStyle=data.color; ctx.lineWidth=data.thickness; }
    ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(p[0],p[1]); ctx.stroke();
    lastX=p[0]; lastY=p[1];
  }
  function end(){ if(drawing){ drawing=false; data.dataURL = canvas.toDataURL('image/png'); markDirty(); } }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
  shell.querySelector('.d-color').addEventListener('input', function(e){ data.color=e.target.value; });
  shell.querySelector('.d-thick').addEventListener('input', function(e){
    data.thickness=+e.target.value;
    shell.querySelector('.draw-thick-label').textContent=data.thickness+'px';
  });
  return shell;
}

function renderImageBlock(data){
  var inner = '<img src="'+data.dataURL+'" alt="Immagine inserita">';
  return makeBlockShell(data, inner, 'el-image');
}
function renderAudioBlock(data){
  var inner = '<audio controls src="'+data.dataURL+'"></audio>';
  return makeBlockShell(data, inner, 'el-audio-block');
}
function renderVideoBlock(data){
  var inner = '<video controls src="'+data.dataURL+'"></video>';
  return makeBlockShell(data, inner, 'el-video-block');
}
function renderLinkBlock(data){
  var inner = '<a href="'+escapeAttr(data.url)+'" target="_blank" rel="noopener noreferrer" class="el-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+ICONS.link+'</svg><span>'+escapeHtml(data.label||data.url)+'</span></a>';
  return makeBlockShell(data, inner, 'el-link-block');
}
function renderElementFromData(data){
  switch(data.type){
    case 'text': return renderTextBlock(data);
    case 'drawing': return renderDrawingBlock(data);
    case 'image': return renderImageBlock(data);
    case 'audio': return renderAudioBlock(data);
    case 'video': return renderVideoBlock(data);
    case 'link': return renderLinkBlock(data);
    default: return document.createElement('div');
  }
}
function addElement(data){
  clearEmptyHint();
  state.dayElements.push(data);
  var node = renderElementFromData(data);
  $('#dayElements').appendChild(node);
  markDirty();
  node.scrollIntoView({behavior:'smooth', block:'center'});
}

var recognition=null, recognizing=false;
$('#btnDictation').addEventListener('click', function(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ showToast('Il tuo browser non supporta la dettatura vocale. Prova Chrome o Edge.', 'error'); return; }
  if(recognizing){ recognition.stop(); return; }
  try{ recognition = new SR(); }
  catch(err){ showToast('Impossibile avviare la dettatura.', 'error'); return; }
  recognition.lang='it-IT'; recognition.continuous=true; recognition.interimResults=true;
  clearEmptyHint();
  var data = {id:uid(), type:'text', html:'', size:16, bold:false, italic:false, underline:false, color:'#2E2A22'};
  state.dayElements.push(data);
  var node = renderTextBlock(data);
  $('#dayElements').appendChild(node);
  var contentEl = node.querySelector('.text-content');
  var finalText='';
  recognition.onresult = function(ev){
    var interim='';
    for(var i=ev.resultIndex;i<ev.results.length;i++){
      var t=ev.results[i][0].transcript;
      if(ev.results[i].isFinal) finalText+=t+' '; else interim+=t;
    }
    contentEl.textContent = (finalText+interim).trim();
    data.html = contentEl.innerHTML;
    markDirty();
  };
  recognition.onerror = function(ev){ if(ev.error!=='no-speech') showToast('Errore microfono: '+ev.error, 'error'); };
  recognition.onend = function(){ recognizing=false; $('#btnDictation').classList.remove('active'); };
  try{ recognition.start(); recognizing=true; $('#btnDictation').classList.add('active'); }
  catch(err){ showToast('Impossibile avviare la dettatura.', 'error'); }
});

async function startAudioRecording(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    showToast('Registrazione non disponibile su questo dispositivo/browser. Usa "Carica file".', 'error'); return;
  }
  var stream;
  try{ stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(err){ showToast('Accesso al microfono negato o non disponibile. Usa "Carica file".', 'error'); return; }
  var chunks=[]; var mr;
  try{ mr = new MediaRecorder(stream); }
  catch(err){ showToast('Registrazione non supportata su questo browser.', 'error'); stream.getTracks().forEach(function(t){t.stop();}); return; }
  mr.ondataavailable = function(e){ if(e.data && e.data.size>0) chunks.push(e.data); };
  mr.onstop = function(){
    stream.getTracks().forEach(function(t){ t.stop(); });
    var blob = new Blob(chunks, {type: mr.mimeType||'audio/webm'});
    if(blob.size > 4.5*1024*1024){ showToast('Registrazione troppo grande, non salvata.', 'error'); return; }
    var reader = new FileReader();
    reader.onload = function(){ addElement({id:uid(), type:'audio', dataURL:reader.result}); };
    reader.readAsDataURL(blob);
  };
  mr.start();
  showRecordingBanner(mr);
}
function showRecordingBanner(mr){
  var banner = document.createElement('div');
  banner.className='recording-banner';
  banner.innerHTML = '<span>&#9679; Registrazione in corso...</span><button type="button" id="stopRecBtn">Stop</button>';
  document.body.appendChild(banner);
  banner.querySelector('#stopRecBtn').onclick = function(){ mr.stop(); banner.remove(); };
}

/* ---- alarm ---- */
$('#btnAlarm').addEventListener('click', function(){
  var current = state.dayAlarm;
  openModal(
    '<h3>Sveglia per '+formatDateIt(state.currentDate)+'</h3>'+
    '<label for="alarmTime">Orario</label>'+
    '<input type="time" id="alarmTime" value="'+(current?current.time:'')+'">'+
    '<div class="modal-actions">'+
      (current ? '<button type="button" class="btn-secondary" id="alarmRemove">Rimuovi sveglia</button>' : '')+
      '<button type="button" class="btn-secondary" id="alarmCancel">Annulla</button>'+
      '<button type="button" class="btn-primary" id="alarmConfirm">Imposta</button>'+
    '</div>'
  );
  $('#alarmCancel').onclick = closeModal;
  $('#alarmConfirm').onclick = async function(){
    var t = $('#alarmTime').value;
    if(!t){ showToast('Imposta un orario valido.', 'error'); return; }
    state.dayAlarm = {time:t, fired:false};
    await persistAlarm();
    updateAlarmButtonState();
    showToast('Sveglia impostata per le '+t+'.', 'success');
    closeModal();
  };
  var removeBtn = $('#alarmRemove');
  if(removeBtn){
    removeBtn.onclick = async function(){
      state.dayAlarm = null;
      await persistAlarm();
      updateAlarmButtonState();
      showToast('Sveglia rimossa.', 'info');
      closeModal();
    };
  }
});
async function persistAlarm(){
  await saveDayData(true);
  var key = 'agenda_alarms:'+state.email+':'+state.currentAgendaId;
  var idx = await getJSON(key) || [];
  var dStr = dateKey(state.currentDate);
  idx = idx.filter(function(a){ return a.date!==dStr; });
  if(state.dayAlarm) idx.push({date:dStr, time:state.dayAlarm.time, fired:false});
  await setJSON(key, idx);
  state.allAlarms = state.allAlarms.filter(function(a){ return !(a.agendaId===state.currentAgendaId && a.date===dStr); });
  if(state.dayAlarm) state.allAlarms.push({agendaId:state.currentAgendaId, date:dStr, time:state.dayAlarm.time, fired:false});
}

function playBeep(){
  try{
    var ctx = new (window.AudioContext||window.webkitAudioContext)();
    var now = ctx.currentTime;
    [0,0.32,0.64].forEach(function(off){
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type='sine'; o.frequency.value=880;
      g.gain.setValueAtTime(0.0001, now+off);
      g.gain.exponentialRampToValueAtTime(0.3, now+off+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now+off+0.25);
      o.connect(g); g.connect(ctx.destination);
      o.start(now+off); o.stop(now+off+0.3);
    });
  }catch(e){}
}
async function triggerAlarm(alarm){
  alarm.fired = true;
  playBeep();
  showToast('Sveglia: hai un promemoria per oggi.', 'success');
  var key = 'agenda_alarms:'+state.email+':'+alarm.agendaId;
  var idx = await getJSON(key) || [];
  idx = idx.map(function(x){ return (x.date===alarm.date) ? Object.assign({}, x, {fired:true}) : x; });
  await setJSON(key, idx);
  await openAgendaById(alarm.agendaId);
  await openDayScreen(new Date(alarm.date+'T00:00:00'));
}
function checkAlarms(){
  if(!state.email || state.allAlarms.length===0) return;
  var now = new Date();
  var todayStr = dateKey(now);
  var hh = String(now.getHours()).padStart(2,'0');
  var mm = String(now.getMinutes()).padStart(2,'0');
  var nowHM = hh+':'+mm;
  state.allAlarms.forEach(function(a){
    if(!a.fired && a.date===todayStr && a.time<=nowHM){ triggerAlarm(a); }
  });
}
setInterval(checkAlarms, 20000);

  if(state.dirty){ e.preventDefault(); e.returnValue=''; }
});
